# ============================================================================
# amitOS — Kernel Modules to Load at Boot
# ============================================================================
# Place this file at: /etc/modules-load.d/amitos.conf
# These modules are loaded automatically by systemd-modules-load.service
# ============================================================================

# --- Container / Docker support ---
overlay
br_netfilter

# --- Firewall (nftables) ---
nf_tables

# --- CAN Bus (Industrial Fieldbus) ---
# Uncomment the specific CAN driver for your hardware:
# can
# can-raw
# can-gw
# vcan          # Virtual CAN for testing

# --- Hardware Interfaces ---
# Uncomment as needed for your edge hardware:
# i2c-dev       # I2C userspace access
# spi-dev       # SPI userspace access
# gpio-cdev     # GPIO character device

# --- Serial Communication ---
# ftdi_sio      # FTDI USB-to-serial
# cp210x        # Silicon Labs USB-to-serial
# ch341         # CH340/CH341 USB-to-serial
# pl2303        # Prolific USB-to-serial

# --- Block Devices ---
# nbd           # Network Block Device (for remote imaging)

# --- GPU ---
# nvidia        # Loaded by nvidia-persistenced if installed

# --- Watchdog ---
# softdog       # Software watchdog (for systems without HW watchdog)
