# ============================================================================
# amitOS — Kernel Runtime Parameters (sysctl)
# ============================================================================
# Place this file at: /etc/sysctl.d/99-amitos.conf
# Apply manually: sudo sysctl --system
# ============================================================================

# ----------------------------------------------------------------------------
# 1. NETWORK — Industrial & Container Networking
# ----------------------------------------------------------------------------
# Enable IP forwarding (required for Docker / container networking)
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Bridge calls to iptables/nftables (required for Docker)
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# Increase connection tracking table (industrial systems have many connections)
net.netfilter.nf_conntrack_max = 131072

# TCP tuning for industrial networks (low-latency, moderate throughput)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 5000
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0

# Use BBR congestion control when available
net.ipv4.tcp_congestion_control = bbr

# Reduce TIME_WAIT connections (edge devices with many short-lived connections)
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# ARP cache tuning (large industrial networks)
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096

# Disable ICMP redirects (security: prevent MITM)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Disable source routing (security)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Enable SYN cookies (protect against SYN flood)
net.ipv4.tcp_syncookies = 1

# Ignore ICMP broadcasts (prevent smurf attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Log martian packets (security auditing)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# ----------------------------------------------------------------------------
# 2. REAL-TIME / SCHEDULING — Industrial Performance
# ----------------------------------------------------------------------------
# Allow real-time scheduling for industrial control processes
kernel.sched_rt_runtime_us = 950000
kernel.sched_rt_period_us = 1000000

# Reduce latency by minimizing scheduler migration cost
kernel.sched_migration_cost_ns = 5000000

# Increase max real-time priority range
kernel.sched_nr_migrate = 32

# ----------------------------------------------------------------------------
# 3. MEMORY — Edge Device Optimization
# ----------------------------------------------------------------------------
# Shared memory limits (needed for CUDA and large dataset processing)
kernel.shmmax = 68719476736
kernel.shmall = 4294967296

# File descriptor limits (many adapter connections + Docker)
fs.file-max = 1048576
fs.nr_open = 1048576

# inotify limits (Docker, file watchers)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# Reduce swappiness (prefer keeping data in RAM on edge devices)
vm.swappiness = 10

# Overcommit handling — heuristic mode
vm.overcommit_memory = 0

# Dirty page writeout tuning (prevent I/O stalls)
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# ----------------------------------------------------------------------------
# 4. KERNEL — System Stability & Security
# ----------------------------------------------------------------------------
# Enable magic SysRq (emergency debugging on headless systems)
kernel.sysrq = 1

# Watchdog — reboot on hard lockup
kernel.nmi_watchdog = 1
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 0
kernel.hung_task_timeout_secs = 120

# Core dump settings (disable in production, enable for debugging)
kernel.core_pattern = /var/log/amitos/core.%e.%p.%t
fs.suid_dumpable = 0

# Restrict kernel log access (security)
kernel.dmesg_restrict = 1

# Restrict BPF to root (security)
kernel.unprivileged_bpf_disabled = 1

# Restrict user namespaces (optional, may conflict with rootless Docker)
# kernel.unprivileged_userns_clone = 0

# Restrict perf_event access
kernel.perf_event_paranoid = 2

# ASLR — Full randomization
kernel.randomize_va_space = 2

# Restrict ptrace for security
kernel.yama.ptrace_scope = 1

# Kernel panic behavior — auto-reboot after 10 seconds
kernel.panic = 10
kernel.panic_on_oops = 1

# ----------------------------------------------------------------------------
# 5. PRESSURE STALL INFORMATION (PSI)
# ----------------------------------------------------------------------------
# Keep PSI monitoring enabled for health checks
# (No sysctl needed — enabled via kernel config CONFIG_PSI=y)
