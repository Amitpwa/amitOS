# ============================================================================
# amitOS — Nginx Reverse Proxy Configuration
# ============================================================================
# File location: /etc/nginx/sites-available/amitos-dashboard.conf
# Symlink to: /etc/nginx/sites-enabled/amitos-dashboard.conf
# ============================================================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dashboard:10m rate=10r/s;

# Upstream: REST API Bridge adapter
upstream rest_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Upstream: Dashboard backend (FastAPI) — planned for v0.3.0
upstream dashboard_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # --- TLS Configuration ---
    ssl_certificate     /etc/amitos/nginx/certs/server.crt;
    ssl_certificate_key /etc/amitos/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- REST API Bridge ---
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://rest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Dashboard (v0.3.0) ---
    location /dashboard/ {
        limit_req zone=dashboard burst=20 nodelay;

        proxy_pass http://dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Health endpoint ---
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"amitos"}';
        add_header Content-Type application/json;
    }

    # --- Static files (dashboard frontend) ---
    location / {
        root /opt/amitos/dashboard/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- Deny hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
